<!doctype html><html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>IMPULSE AI</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#07111f;color:#eef6ff;font:15px system-ui,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{display:flex;min-height:100vh}.side{width:220px;background:#091626;padding:18px;border-right:1px solid #203750}.brand{font-size:23px;font-weight:800;margin-bottom:25px}.brand b{color:#55d6be}.nav button{width:100%;padding:11px;margin:4px 0;background:transparent;color:#9badc0;border:0;border-radius:9px;text-align:left}.nav button:hover,.nav .on{background:#12263d;color:#fff}.main{padding:24px;max-width:1400px;width:100%}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.muted{color:#91a4b8}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{background:#0d1b2d;border:1px solid #203750;border-radius:14px;padding:16px;margin-bottom:16px}.stat b{font-size:26px;display:block;margin-top:5px}.toolbar{display:flex;gap:9px;margin-bottom:14px}.toolbar input{flex:1}input,select,textarea{background:#081626;color:#fff;border:1px solid #29415a;border-radius:8px;padding:10px;width:100%}.btn{background:#55d6be;color:#06121c;border:0;border-radius:9px;padding:10px 14px;font-weight:800}.secondary{background:#14283e;color:#fff;border:1px solid #29415a}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:11px;border-bottom:1px solid #1b3046}th{color:#91a4b8;font-size:12px}.hidden{display:none}.modal{position:fixed;inset:0;background:#000b;display:grid;place-items:center;padding:15px}.box{background:#0b192b;border:1px solid #29415a;border-radius:15px;padding:20px;width:min(650px,100%);max-height:90vh;overflow:auto}.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{grid-column:1/-1}.item{display:grid;grid-template-columns:1fr 80px 110px 30px;gap:7px;align-items:center;padding:8px;border-bottom:1px solid #203750}.empty{text-align:center;padding:30px;color:#91a4b8}.login{min-height:100vh;display:grid;place-items:center;padding:20px}.login .box{width:min(420px,100%)}@media(max-width:800px){.app{display:block}.side{width:100%;display:flex;align-items:center;gap:10px;padding:10px}.brand{margin:0}.nav{display:flex;flex:1}.nav button{padding:8px}.main{padding:14px}.grid{grid-template-columns:1fr 1fr}.form{grid-template-columns:1fr}.full{grid-column:auto}}@media(max-width:500px){.nav button{font-size:0}.nav button:first-letter{font-size:18px}.top{align-items:flex-start;gap:10px}.top h1{font-size:21px}}
</style></head><body>
<div id="login" class="login"><div class="box"><div class="brand">IMPULSE <b>AI</b></div><h2>Entrar</h2><p class="muted">Panel inteligente para tu negocio.</p><input id="email" type="email" placeholder="Email"><br><br><input id="pass" type="password" placeholder="Contraseña"><br><br><button class="btn" style="width:100%" onclick="login()">Iniciar sesión</button><button class="btn secondary" style="width:100%;margin-top:8px" onclick="signup()">Crear cuenta</button><p id="msg" class="muted"></p></div></div>
<div id="app" class="app hidden"><aside class="side"><div class="brand">IMPULSE <b>AI</b></div><nav class="nav">
<button id="nDashboard" class="on" onclick="show('dashboard')">📊 Inicio</button><button id="nProducts" onclick="show('products')">📦 Productos</button><button id="nCustomers" onclick="show('customers')">👥 Clientes</button><button id="nOrders" onclick="show('orders')">🛒 Pedidos</button></nav><button class="btn secondary" onclick="logout()">Salir</button></aside>
<main class="main"><div class="top"><div><h1 id="title">Inicio</h1><span id="biz" class="muted"></span></div><button class="btn" onclick="openCustomer()">+ Cliente</button></div>
<section id="dashboard"><div class="grid"><div class="card stat">Productos<b id="sp">0</b></div><div class="card stat">Clientes<b id="sc">0</b></div><div class="card stat">Pedidos<b id="so">0</b></div><div class="card stat">Ventas pagadas<b id="ss">$0</b></div></div><div class="card"><h3>Pedidos recientes</h3><div id="recent" class="empty">Cargando...</div></div></section>
<section id="products" class="hidden"><div class="card"><div class="toolbar"><input id="ps" placeholder="Buscar producto..." oninput="renderProducts()"></div><div id="pt"></div></div></section>
<section id="customers" class="hidden"><div class="card"><div class="toolbar"><input id="cs" placeholder="Buscar cliente..." oninput="renderCustomers()"><button class="btn" onclick="openCustomer()">+ Nuevo</button></div><div id="ct"></div></div></section>
<section id="orders" class="hidden"><div class="card"><div class="toolbar"><input id="os" placeholder="Buscar pedido o cliente..." oninput="renderOrders()"><select id="of" onchange="renderOrders()"><option value="">Todos</option><option value="pending">Pendiente</option><option value="confirmed">Confirmado</option><option value="paid">Pagado</option><option value="preparing">Preparando</option><option value="shipped">Enviado</option><option value="completed">Completado</option><option value="cancelled">Cancelado</option></select><button class="btn" onclick="openOrder()">+ Pedido</button></div><div id="ot"></div></div></section></main></div>

<div id="cm" class="modal hidden"><div class="box"><div class="top"><h2 id="cmh">Nuevo cliente</h2><button class="secondary" onclick="closeM('cm')">×</button></div><input type="hidden" id="cid"><div class="form">
<label>Nombre *<input id="cn"></label><label>WhatsApp<input id="cp"></label><label>Email<input id="ce"></label><label>Ciudad<input id="cc"></label><label class="full">Dirección<input id="ca"></label><label class="full">Notas<textarea id="cx"></textarea></label></div><br><button class="btn" onclick="saveCustomer()">Guardar</button></div></div>

<div id="om" class="modal hidden"><div class="box"><div class="top"><h2>Nuevo pedido</h2><button class="secondary" onclick="closeM('om')">×</button></div><label>Cliente<select id="oc"></select></label><br><label>Producto<select id="op" onchange="addItem()"><option value="">Agregar producto...</option></select></label><div id="items" class="card"></div><h3 style="text-align:right">Total: <span id="total">$0</span></h3><label>Estado<select id="ost"><option value="pending">Pendiente</option><option value="confirmed">Confirmado</option><option value="paid">Pagado</option><option value="preparing">Preparando</option><option value="shipped">Enviado</option><option value="completed">Completado</option><option value="cancelled">Cancelado</option></select></label><br><label>Notas<textarea id="on"></textarea></label><br><button class="btn" onclick="saveOrder()">Crear pedido</button></div></div>

<script>
const URL='https://ksuoodeqtjzjyuxkphsy.supabase.co',KEY='sb_publishable_mscRoZ4sAGKlIxo5wF6F2Q_f0pqhAoF',db=supabase.createClient(URL,KEY);
let user,biz,customers=[],products=[],orders=[],items=[];const labels={pending:'Pendiente',confirmed:'Confirmado',paid:'Pagado',preparing:'Preparando',shipped:'Enviado',completed:'Completado',cancelled:'Cancelado'};
const esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const money=x=>new Intl.NumberFormat('es-AR',{style:'currency',currency:'ARS'}).format(x||0);
async function init(){let r=await db.auth.getUser();user=r.data.user;if(!user)return;let q=await db.from('business_members').select('business_id,businesses(*)').eq('user_id',user.id).limit(1).single();if(q.error){alert(q.error.message);return}biz=q.data.businesses;document.getElementById('biz').textContent=biz.name;login.classList.add('hidden');app.classList.remove('hidden');await load()}
async function load(){let [a,b,c]=await Promise.all([db.from('customers').select('*').eq('business_id',biz.id).order('created_at',{ascending:false}),db.from('products').select('*').eq('business_id',biz.id).eq('active',true).order('name'),db.from('orders').select('*').eq('business_id',biz.id).order('created_at',{ascending:false})]);if(a.error||b.error||c.error){alert((a.error||b.error||c.error).message);return}customers=a.data||[];products=b.data||[];orders=c.data||[];renderAll()}
function renderAll(){sp.textContent=products.length;sc.textContent=customers.length;so.textContent=orders.length;ss.textContent=money(orders.filter(x=>x.payment_status==='paid').reduce((a,x)=>a+Number(x.total),0));renderCustomers();renderProducts();renderOrders();recent.innerHTML=orders.length?orders.slice(0,5).map(o=>`<p>Pedido <b>#${o.id.slice(0,8)}</b> — ${esc(name(o.customer_id))} — ${money(o.total)} — <b>${labels[o.status]}</b></p>`).join(''):'No hay pedidos todavía.'}
function name(id){return customers.find(x=>x.id===id)?.name||'Cliente'}
function show(id){['dashboard','products','customers','orders'].forEach(x=>document.getElementById(x).classList.toggle('hidden',x!==id));title.textContent={dashboard:'Inicio',products:'Productos',customers:'Clientes',orders:'Pedidos'}[id];document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('on'));document.getElementById('n'+id[0].toUpperCase()+id.slice(1)).classList.add('on')}
function renderProducts(){let t=(ps.value||'').toLowerCase(),a=products.filter(x=>(x.name+' '+(x.sku||'')).toLowerCase().includes(t));pt.innerHTML=a.length?`<table><tr><th>Producto</th><th>Precio</th><th>Stock</th></tr>${a.map(x=>`<tr><td>${esc(x.name)}</td><td>${money(x.price)}</td><td>${x.stock}</td></tr>`).join('')}</table>`:'<div class="empty">No hay productos.</div>'}
function renderCustomers(){let t=(cs.value||'').toLowerCase(),a=customers.filter(x=>(x.name+' '+(x.phone||'')+' '+(x.email||'')).toLowerCase().includes(t));ct.innerHTML=a.length?`<table><tr><th>Cliente</th><th>WhatsApp</th><th>Email</th><th></th></tr>${a.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.phone||'—')}</td><td>${esc(x.email||'—')}</td><td><button class="secondary" onclick="editCustomer('${x.id}')">Editar</button></td></tr>`).join('')}</table>`:'<div class="empty">No hay clientes. Creá el primero.</div>'}
function renderOrders(){let t=(os.value||'').toLowerCase(),f=of.value,a=orders.filter(x=>(!f||x.status===f)&&((x.id+' '+name(x.customer_id)).toLowerCase().includes(t)));ot.innerHTML=a.length?`<table><tr><th>Pedido</th><th>Cliente</th><th>Total</th><th>Estado</th></tr>${a.map(x=>`<tr><td>#${x.id.slice(0,8)}</td><td>${esc(name(x.customer_id))}</td><td>${money(x.total)}</td><td><select onchange="status('${x.id}',this.value)">${Object.entries(labels).map(([k,v])=>`<option value="${k}" ${x.status===k?'selected':''}>${v}</option>`).join('')}</select></td></tr>`).join('')}</table>`:'<div class="empty">No hay pedidos.</div>'}
function openCustomer(c){cid.value=c?.id||'';cmh.textContent=c?'Editar cliente':'Nuevo cliente';cn.value=c?.name||'';cp.value=c?.phone||'';ce.value=c?.email||'';cc.value=c?.city||'';ca.value=c?.address||'';cx.value=c?.notes||'';cm.classList.remove('hidden')}
function editCustomer(id){openCustomer(customers.find(x=>x.id===id))}function closeM(id){document.getElementById(id).classList.add('hidden')}
async function saveCustomer(){if(!cn.value.trim())return alert('El nombre es obligatorio');let p={business_id:biz.id,name:cn.value.trim(),phone:cp.value.trim()||null,email:ce.value.trim()||null,city:cc.value.trim()||null,address:ca.value.trim()||null,notes:cx.value.trim()||null},id=cid.value,r=id?await db.from('customers').update(p).eq('id',id).eq('business_id',biz.id).select().single():await db.from('customers').insert(p).select().single();if(r.error)return alert(r.error.message);closeM('cm');await load();show('customers')}
function openOrder(){if(!customers.length)return alert('Primero creá un cliente.');if(!products.length)return alert('Primero cargá productos.');oc.innerHTML=customers.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('');op.innerHTML='<option value="">Agregar producto...</option>'+products.map(x=>`<option value="${x.id}">${esc(x.name)} — ${money(x.price)} (stock ${x.stock})</option>`).join('');items=[];renderItems();om.classList.remove('hidden')}
function addItem(){let p=products.find(x=>x.id===op.value);if(!p)return;let i=items.find(x=>x.product_id===p.id);if(i)i.quantity++;else items.push({product_id:p.id,product_name:p.name,quantity:1,unit_price:Number(p.price)});op.value='';renderItems()}
function renderItems(){items.innerHTML;let total=0;document.getElementById('items').innerHTML=items.length?items.map((x,i)=>{total+=x.quantity*x.unit_price;return `<div class="item"><span>${esc(x.product_name)}</span><input type="number" min="1" value="${x.quantity}" onchange="items[${i}].quantity=Math.max(1,+this.value||1);renderItems()"><span>${money(x.quantity*x.unit_price)}</span><button onclick="items.splice(${i},1);renderItems()">×</button></div>`}).join(''):'<div class="empty">Agregá productos al pedido.</div>';document.getElementById('total').textContent=money(total)}
async function saveOrder(){if(!items.length)return alert('Agregá al menos un producto.');let total=items.reduce((a,x)=>a+x.quantity*x.unit_price,0),status=ost.value,r=await db.from('orders').insert({business_id:biz.id,customer_id:oc.value,status,payment_status:status==='paid'?'paid':'pending',total,notes:on.value||null}).select().single();if(r.error)return alert(r.error.message);let rows=items.map(x=>({order_id:r.data.id,...x,subtotal:x.quantity*x.unit_price})),ri=await db.from('order_items').insert(rows).select();if(ri.error){await db.from('orders').delete().eq('id',r.data.id);return alert(ri.error.message)}closeM('om');await load();show('orders');alert('Pedido creado correctamente')}
async function status(id,s){let p={status:s};if(s==='paid')p.payment_status='paid';let r=await db.from('orders').update(p).eq('id',id).eq('business_id',biz.id).select().single();if(r.error)alert(r.error.message);else await load()}
async function login(){let r=await db.auth.signInWithPassword({email:email.value,password:pass.value});if(r.error)return msg.textContent=r.error.message;await init()}
async function signup(){let r=await db.auth.signUp({email:email.value,password:pass.value,emailRedirectTo:location.origin});msg.textContent=r.error?r.error.message:'Cuenta creada. Revisá tu email si pide confirmación.'}
async function logout(){await db.auth.signOut();location.reload()}init();
</script></body></html>
